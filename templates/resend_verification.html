{% extends "base.html" %}
{% block title %}Resend Verification - Expense Tracker{% endblock %}
{% block page_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card animate-in">
    <div class="auth-brand">{% include '_brand.html' %}</div>
    <h1 class="auth-title">Resend verification</h1>
    <p class="auth-subtitle">Enter the email address used when creating your account.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label class="form-label" for="verify-email">Email address</label>
            <input class="form-input" type="email" id="verify-email" name="email" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Send link</button>
    </form>
    <div class="auth-footer"><a href="{{ url_for('login') }}">Back to Login</a></div>
</div>
{% endblock %}
