{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h2>Login</h2>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Username</label>

                    <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

                </div>

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="remember"
                        id="remember">

                    <label
                        class="form-check-label"
                        for="remember">

                        Remember Me

                    </label>

                </div>

                <button
                type="submit"
                class="btn btn-primary">

                    Login

                </button>

                <div class="mt-3">

                    <a href="/forgot-password">
                        Forgot Password?
                    </a>

                </div>

                <hr>

                <div>

                    Don't have an account?

                    <a href="/register">
                        Register
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
